<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petrichor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Syne:wght@500;600;700;800&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#DCE1DA; --wall-2:#CFD7CD; --ink:#1D2624; --ink-2:#55605B; --mat:#FBFBF7;
  --line:rgba(29,38,36,.16); --indigo:#2B3C98; --on-indigo:#FFFFFF; --sold:#C2352B; --sig:#1F2C6B;
  --ok:#3E8E6B; --wait:#C98A1B;
  --shadow:0 1px 0 rgba(0,0,0,.06), 0 22px 28px -24px rgba(20,30,28,.6);
  --display:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --text:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --gut:clamp(16px,4vw,48px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#1A201E; --wall-2:#232B28; --ink:#E4E9E3; --ink-2:#A3ADA7; --mat:#2A322F;
    --line:rgba(228,233,227,.16); --indigo:#9CAAFF; --on-indigo:#121633; --sold:#FF6E61; --sig:#BCC6FF;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 22px 28px -22px rgba(0,0,0,.85); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#1A201E; --wall-2:#232B28; --ink:#E4E9E3; --ink-2:#A3ADA7; --mat:#2A322F;
  --line:rgba(228,233,227,.16); --indigo:#9CAAFF; --on-indigo:#121633; --sold:#FF6E61; --sig:#BCC6FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 22px 28px -22px rgba(0,0,0,.85); color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--text);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
#main:focus{outline:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
figure{margin:0}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--wall) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;min-height:66px}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;text-decoration:none}
.logo span{font-weight:500;font-size:.85rem;letter-spacing:0;color:var(--ink-2);margin-left:6px}
nav.main{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main a{padding:8px 13px;border-radius:999px;text-decoration:none;font-weight:500;white-space:nowrap}
nav.main a:hover{background:var(--wall-2)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--wall)}
nav.main a.studio-link{margin-left:10px;border:1.5px solid var(--line)}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:2px;padding:10px var(--gut) 8px;min-height:0}
  nav.main{order:3;flex:0 0 auto;min-width:0;width:calc(100% + 2 * var(--gut));margin:4px 0 0 calc(-1 * var(--gut));padding:0 var(--gut) 2px}
  nav.main a{padding:7px 12px;font-size:.95rem}
  nav.main a.studio-link{margin-left:6px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font:600 1rem/1.2 var(--text);text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.small{min-height:36px;padding:0 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.link{font-weight:600;text-underline-offset:4px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);padding:clamp(40px,7vw,100px) var(--gut) clamp(56px,8vw,110px);align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:.86;letter-spacing:-.05em;margin:0 0 .28em}
.lede{font-size:clamp(1.05rem,1.5vw,1.2rem);max-width:38ch;color:var(--ink-2);margin:0}
.salon{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(14px,2.4vw,32px);align-items:end}
.salon .s1{grid-row:1 / span 2;align-self:center}
.salon .s3{width:78%}
.caption{font-size:.88rem;color:var(--ink-2);margin-top:12px;line-height:1.45}
.caption strong{color:var(--ink);font-family:var(--display);font-weight:600}
@keyframes hang{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.salon .frame{animation:hang .9s cubic-bezier(.2,.7,.2,1) both}
.salon .s2 .frame{animation-delay:.18s}
.salon .s3 .frame{animation-delay:.34s}
@media (max-width:880px){.hero{grid-template-columns:1fr}}

/* frames and works */
.frame{background:var(--mat);padding:clamp(10px,1.5vw,16px);box-shadow:var(--shadow)}
.frame svg,.frame img{display:block;width:100%;height:auto}
.frame-link{display:block;text-decoration:none}
.crop{display:block;width:100%;height:100%;object-fit:cover}
.gallery{columns:3 250px;column-gap:clamp(20px,3vw,44px)}
.gallery.small{columns:3 150px;column-gap:20px}
.work{display:inline-block;width:100%;break-inside:avoid;margin:0 0 clamp(30px,3.5vw,48px)}
.label h3{font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;margin:14px 0 2px;line-height:1.25}
.label h3 a{text-decoration:none}
.label h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.by{margin:0;font-weight:500}
.meta{margin:0;color:var(--ink-2);font-size:.92rem}
.price{margin:6px 0 0;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot-sold{background:var(--sold)}
.dot-reserved{border:2px solid var(--sold)}
.dot-available{display:none}

/* sections */
.section{padding:clamp(52px,7vw,100px) 0}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:clamp(26px,3vw,44px)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.6rem);letter-spacing:-.03em;line-height:1.05;margin:0}
.kicker{margin:0 0 10px;font-weight:600;color:var(--indigo)}
.when{font-weight:600;margin:12px 0 4px}
.show{background:var(--wall-2)}
.show-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(28px,5vw,72px);align-items:center}
.show-in p{max-width:52ch}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,24px);align-items:end}
.thumbs .frame{padding:8px}
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:clamp(20px,3vw,36px)}
.artist{text-decoration:none;display:block}
.artist .ph{aspect-ratio:1;overflow:hidden;background:var(--mat);padding:10px;box-shadow:var(--shadow)}
.artist h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:14px 0 0;letter-spacing:-.01em}
.artist p{margin:0;color:var(--ink-2);font-size:.95rem}
.artist:hover h3{text-decoration:underline;text-underline-offset:3px}
.posts{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,3vw,40px)}
.posts li{border-top:2px solid var(--ink);padding-top:18px}
.posts h3{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 8px}
.posts h3 a{text-decoration:none}
.posts h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.posts p{margin:0 0 8px;color:var(--ink-2)}
.posts .m{font-size:.9rem}

/* page heads */
.page-head{padding:clamp(40px,6vw,80px) 0 18px}
.page-head h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,7vw,5.2rem);letter-spacing:-.045em;line-height:.95;margin:0 0 14px}
.page-head p{max-width:60ch;color:var(--ink-2);margin:0}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:18px 0 40px;padding:14px 0;border-block:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 .95rem var(--text);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--indigo);margin:0}
.legend{margin-left:auto;color:var(--ink-2);font-size:.9rem;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.empty{padding:48px 0;text-align:left}
.empty p{color:var(--ink-2);margin:0 0 16px}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);padding:clamp(24px,4vw,56px) 0 clamp(40px,5vw,72px);align-items:start}
.zoom{all:unset;display:block;cursor:zoom-in;width:100%}
.zoom:focus-visible{outline:2px solid var(--indigo);outline-offset:4px}
.zoom .frame{display:block;padding:clamp(14px,2.4vw,28px)}
.zoom-hint{font-size:.88rem;color:var(--ink-2);margin:12px 0 0}
.back{display:inline-block;margin-top:clamp(20px,3vw,32px);color:var(--ink-2);font-weight:500;text-underline-offset:4px}
.detail h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.035em;line-height:1;margin:0 0 10px}
.artist-link{font-size:1.1rem;font-weight:500;text-underline-offset:4px}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:24px 0;padding:18px 0;border-block:1px solid var(--line)}
dl.specs dt{color:var(--ink-2)}
dl.specs dd{margin:0}
.big-price{font-family:var(--display);font-size:1.9rem;font-weight:700;display:flex;align-items:center;gap:12px;margin:0 0 8px;letter-spacing:-.02em}
.desc{margin:0 0 22px}
.hint{font-size:.88rem;color:var(--ink-2);margin:10px 0 0}
.enquiry{margin-top:22px;padding:clamp(18px,3vw,26px);background:var(--mat);border-radius:6px}
.enquiry h3{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 6px}
.contact{display:grid;gap:10px;margin-top:16px}
.contact .btn{justify-content:flex-start}

/* forms */
.field{margin-bottom:14px}
label.l{display:block;font-weight:600;font-size:.92rem;margin:0 0 6px}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--wall);color:var(--ink)}
input[type=file]{font:inherit;font-size:.95rem;width:100%}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* exhibitions and posts */
.exh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(24px,4vw,56px);padding:clamp(32px,4vw,56px) 0;border-top:1px solid var(--line)}
.exh p{max-width:52ch}
.post{max-width:680px;margin:0 auto;padding:clamp(40px,6vw,80px) 0}
.post h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.035em;line-height:1.02;margin:0 0 14px}
.post .m{color:var(--ink-2);margin:0 0 32px}
.post p{font-size:1.12rem;line-height:1.72;margin:0 0 1.2em}

/* studio */
.studio-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:clamp(36px,5vw,64px) 0 24px}
.studio-head h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.045em;line-height:.95;margin:0 0 8px}
.studio-head p{margin:0;color:var(--ink-2)}
.studio-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,32px);padding-bottom:40px;align-items:start}
.panel{background:var(--mat);padding:clamp(18px,3vw,30px);border-radius:6px}
.panel h2{font-size:1.45rem;margin-bottom:18px}
.panel h2:not(:first-child){margin-top:34px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .thumb{width:56px;height:56px;overflow:hidden;background:var(--wall-2)}
.rows .t{font-weight:600;display:block;line-height:1.3}
.rows .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.published{background:color-mix(in srgb,var(--ok) 24%,transparent)}
.tag.pending{background:color-mix(in srgb,var(--wait) 28%,transparent)}
.tag.declined{background:color-mix(in srgb,var(--sold) 22%,transparent)}
.none{color:var(--ink-2);margin:0}
.enq-list{list-style:none;margin:0;padding:0}
.enq-list li{padding:14px 0;border-bottom:1px solid var(--line)}
.enq-list li:last-child{border-bottom:0}
.enq-list .who{font-weight:600}
.enq-list .msg{margin:4px 0 0;color:var(--ink-2)}
.login{max-width:560px;margin:clamp(40px,7vw,96px) auto}
.login h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:-.04em;line-height:1;margin:0 0 14px}
.login p{margin:0 0 10px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 8px}
.stats div{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.stats span{display:block;font-family:var(--text);font-size:.88rem;font-weight:500;color:var(--ink-2);margin-top:4px}

@media (max-width:880px){
  .show-in,.detail,.exh,.studio-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
}


/* hero heading */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* gallery stage: wooden wall, picture lights */
.stage{--sh:clamp(440px,74vh,720px);--ph:calc(var(--sh) * .5);position:relative;isolation:isolate;overflow:hidden;height:var(--sh);display:grid;place-items:center;padding:calc(var(--sh) * .11) 0 calc(var(--sh) * .2);
  background-color:#3a2616;
  background-image:linear-gradient(rgba(12,7,3,.52),rgba(12,7,3,.52)),repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 2px),rgba(0,0,0,.42) calc(12.5% - 2px) 12.5%),var(--wood);
  background-size:auto,auto,520px 520px}
.stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 72% 62% at 50% 36%,transparent 25%,rgba(0,0,0,.6) 100%)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sh) * .18);z-index:0;background:linear-gradient(#2c1e13,#110b06)}
.stage .floor::before{content:"";position:absolute;top:-12px;left:0;right:0;height:12px;background:linear-gradient(#45301e,#23160c);box-shadow:0 -1px 0 rgba(255,220,160,.08)}
.stage .floor::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 45% 70% at 50% 0%,rgba(255,200,130,.2),transparent 70%);opacity:0;transition:opacity 1s}
.stage.lit .floor::after{opacity:1}
.dim{filter:brightness(.38) saturate(.7);transition:filter 1.1s ease}
.stage.lit .dim{filter:none}
.piece-link{display:block;text-decoration:none;color:inherit;-webkit-user-drag:none}
a.piece-link{cursor:pointer}
.hang{position:relative;width:min(calc(var(--ph) * var(--r)),72%)}
.hang .fr{position:relative;z-index:2}
.pic{position:relative}
.pic svg,.pic img{display:block;width:100%;height:auto}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(255,228,175,.38),rgba(255,228,175,.06) 45%,rgba(0,0,0,.2));mix-blend-mode:soft-light;opacity:0;transition:opacity 1.1s}
.stage.lit .sheen{opacity:1}
.lamp{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);width:70%;height:10px;border-radius:5px;z-index:3;background:linear-gradient(#fbe8aa,#d4a640 45%,#8a6220);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.lamp .arm{position:absolute;left:50%;top:100%;width:6px;height:18px;margin-left:-3px;background:linear-gradient(90deg,#7d5a1c,#e7c46a,#7d5a1c)}
.lamp::after{content:"";position:absolute;left:4%;right:4%;bottom:-2px;height:3px;border-radius:2px;background:#fff3d6;opacity:.2;transition:opacity .5s,box-shadow .5s}
.stage.lit .lamp::after{opacity:1;box-shadow:0 2px 12px 3px rgba(255,220,150,.9)}
.glow{position:absolute;left:-50%;right:-50%;top:-45%;bottom:-12%;z-index:1;pointer-events:none;background:radial-gradient(closest-side at 50% 36%,rgba(255,214,150,.6),rgba(255,195,120,.22) 50%,rgba(255,190,110,.06) 78%,transparent 100%);mix-blend-mode:screen;opacity:0;transition:opacity 1.1s}
.stage.lit .glow{opacity:1}
/* gilt frame for paintings */
.k-gilt .fr{padding:clamp(12px,2.2vw,24px);background:repeating-radial-gradient(circle at 0 0,rgba(255,240,190,.22) 0 1px,transparent 1px 5px),linear-gradient(135deg,#7d5a1c 0%,#e8c56a 18%,#a07a2c 34%,#f6df94 50%,#946b25 68%,#dcb65c 84%,#7d5a1c 100%);box-shadow:inset 0 0 0 2px rgba(60,40,10,.6),inset 0 0 0 6px rgba(255,236,170,.35),inset 0 0 0 9px rgba(90,60,15,.45),0 36px 42px -22px rgba(0,0,0,.9)}
.k-gilt .pic{box-shadow:0 0 0 3px #6d4e17,0 0 0 5px #e9cf7d}
/* walnut frame and mat for prints */
.k-walnut .fr{padding:clamp(8px,1.4vw,14px);background:linear-gradient(135deg,#5a3a22,#2e1d11 40%,#4a2f1b 70%,#23160c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 32px 38px -22px rgba(0,0,0,.9)}
.k-walnut .pic{background:#f4f1e8;padding:9%;box-shadow:inset 3px 3px 7px rgba(0,0,0,.2)}
/* hanging rod for textiles */
.k-rod .fr{box-shadow:0 28px 32px -18px rgba(0,0,0,.85)}
.k-rod .fr::before{content:"";position:absolute;top:-10px;left:-7%;right:-7%;height:9px;border-radius:5px;z-index:3;background:linear-gradient(#f6dc8c,#b8862b 55%,#6f4d17)}
.k-rod .lamp{bottom:calc(100% + 30px)}
.k-rod .lamp .arm{height:21px}
/* plinth and ceiling spot for sculpture */
.plinth-set{position:relative;z-index:2;align-self:end;width:min(calc(var(--ph) * 1.15),62%);display:flex;flex-direction:column;align-items:center}
.plinth-set svg{display:block;width:100%;height:auto;margin-bottom:-2px}
.plinth{width:74%;height:calc(var(--sh) * .25);background:linear-gradient(90deg,#cfc8bb,#f7f3ea 40%,#e6e0d4 70%,#bdb5a6);border-top:1px solid rgba(255,255,255,.7);box-shadow:0 30px 40px -24px rgba(0,0,0,.9)}
.beam{position:absolute;top:0;bottom:calc(var(--sh) * .18);left:50%;width:min(60%,calc(var(--ph) * 1.5));transform:translateX(-50%);z-index:1;pointer-events:none;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);background:linear-gradient(to bottom,rgba(255,224,168,.45),rgba(255,210,150,.12) 75%,rgba(255,210,150,0));mix-blend-mode:screen;opacity:0;transition:opacity 1.1s}

.stage.lit .beam,.stage.lit .pool{opacity:1}
/* wall label */
.plaque{position:absolute;right:5%;bottom:calc(var(--sh) * .24);z-index:3;width:210px;padding:12px 14px;background:#f4efe4;color:#231a12;font-size:.84rem;line-height:1.4;box-shadow:0 10px 18px -8px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:1px}

.car-btn{position:absolute;top:50%;z-index:5;width:50px;height:50px;margin-top:-25px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(20,12,6,.45);color:#f6e7c8;border:1px solid rgba(246,231,200,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.cdot::before{content:"";position:absolute;inset:-12px -4px}

.sig{font-family:"Mrs Saint Delafield","Segoe Script","Brush Script MT",cursive;font-weight:400;letter-spacing:0;color:var(--sig)}

        const bottle = (x, bw, bh, nh, nw) => {
          const y = tbl + 6, sh = bw * .9, top = y - bh - sh - nh;
          sm += `<ellipse cx="${f1(x + bw * 1.6)}" cy="${f1(y)}" rx="${f1(bw * 1.8)}" ry="${f1(bw * .35)}" fill="${ink}" opacity=".6"/>`;
          const d = `M${f1(x - bw)} ${f1(y)} L${f1(x - bw)} ${f1(y - bh)} Q${f1(x - bw)} ${f1(y - bh - sh)} ${f1(x - nw)} ${f1(y - bh - sh)} L${f1(x - nw)} ${f1(top)} L${f1(x + nw)} ${f1(top)} L${f1(x + nw)} ${f1(y - bh - sh)} Q${f1(x + bw)} ${f1(y - bh - sh)} ${f1(x + bw)} ${f1(y - bh)} L${f1(x + bw)} ${f1(y)} Z`;
          ln += `<path d="${d}" fill="${paper}" stroke="${ink}" stroke-width="2.6" opacity=".95"/>`;
          const cid = `${id}c${ck++}`; defs += `<clipPath id="${cid}"><path d="${d}"/></clipPath>`;
          let g = ''; for (let xx = x + bw * .1; xx < x + bw; xx += 3.2) g += L(`M${f1(xx)} ${f1(y)} L${f1(xx + jit(3))} ${f1(top)}`, 1.3, .55);
          g += `<rect x="${f1(x + bw * .45)}" y="${f1(top)}" width="${f1(bw * .6)}" height="${f1(y - top)}" fill="${ink}" opacity=".35"/>`;
          ln += `<g clip-path="url(#${cid})">${g}</g>` + L(`M${f1(x - bw * .55)} ${f1(y - bh * .2)} L${f1(x - bw * .55)} ${f1(y - bh * .9)}`, 3, .85, paper);
        };
        bottle(W * .32, W * .07, H * .2, H * .08, W * .02);
        bottle(W * .52, W * .09, H * .13, H * .1, W * .025);
        const bx = W * .76, by = tbl + 10, br = W * .12;
        sm += `<ellipse cx="${f1(bx + br * .9)}" cy="${f1(by)}" rx="${f1(br * 1.3)}" ry="${f1(br * .25)}" fill="${ink}" opacity=".55"/>`;
        ln += `<path d="M${f1(bx - br)} ${f1(by - br * .55)} Q${f1(bx)} ${f1(by + br * .45)} ${f1(bx + br)} ${f1(by - br * .55)} Z" fill="${mid}" stroke="${ink}" stroke-width="2.4" opacity=".9"/>`;
        ln += `<ellipse cx="${f1(bx)}" cy="${f1(by - br * .55)}" rx="${f1(br)}" ry="${f1(br * .18)}" fill="${ink}" opacity=".8"/>`;
        ln += `<circle cx="${f1(W * .13)}" cy="${f1(tbl - W * .035)}" r="${f1(W * .045)}" fill="${mid}" stroke="${ink}" stroke-width="2.2" opacity=".9"/>`;
      }
      body += `<rect width="${W}" height="${H}" fill="${paper}"/><g filter="url(#${id}s)">${sm}</g><g filter="url(#${id}r)" stroke-linecap="round" stroke-linejoin="round">${ln}</g><rect width="${W}" height="${H}" filter="url(#${id}t)" opacity=".4"/>`;
      break;
    }
    case 'threads': {
      body += `<rect width="${W}" height="${H}" fill="${p[0]}"/>`;
      const bands = [p[1], p[2], p[3]];
      let row = 0;
      for (let y = 12; y < H - 6; y += 9){
        const col = bands[Math.floor(row / 5) % bands.length], amp = 1.5 + R() * 1.5, ph = R() * 6;
        let d = `M6 ${y}`;
        for (let x = 6; x <= W - 6; x += 16) d += ` L${x} ${f1(y + Math.sin(x / 28 + ph) * amp)}`;
        body += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round" opacity=".9"/>`;
        row++;
      }
      const cx = W / 2, cy = H / 2;
      body += `<circle cx="${cx}" cy="${cy}" r="${W * .2}" fill="${p[0]}"/>`;
      for (let i = 0; i < 6; i++) body += `<circle cx="${cx}" cy="${cy}" r="${f1(W * (.04 + i * .03))}" fill="none" stroke="${p[4]}" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/>`;
      for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, px = cx + Math.cos(a) * W * .27, py = cy + Math.sin(a) * W * .27; body += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="${W * .05}" ry="${W * .022}" transform="rotate(${i * 45} ${f1(px)} ${f1(py)})" fill="${p[0]}" stroke="${p[4]}" stroke-width="2" stroke-dasharray="4 3"/>`; }
      break;
    }
  }
  if (o.bare){ const top = H * .18, end = (w.g.form === 'pair' ? .835 : w.g.form === 'bowl' ? .785 : .805) * H;
    return `<svg viewBox="0 ${f1(top)} ${W} ${f1(end - top)}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(w.t)} by ${esc(artist(w.a).name)}"><defs>${defs}</defs>${body}</svg>`; }
  const grain = `<filter id="${id}n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>`;
  const crop = o.crop ? ' preserveAspectRatio="xMidYMid slice" class="crop"' : '';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(w.t)} by ${esc(artist(w.a).name)}"${crop}><defs>${defs}${grain}</defs>${body}<rect width="${W}" height="${H}" filter="url(#${id}n)" opacity=".12" style="mix-blend-mode:multiply"/></svg>`;
}
function art(w, o = {}){
  if (w.img) return `<img src="${w.img}" alt="${esc(w.t)} by ${esc(artist(w.a).name)}"${o.crop ? ' class="crop"' : ''}>`;
  return svgArt(w, o);
}

function statusText(w){ return w.st === 'sold' ? 'Sold' : w.st === 'reserved' ? 'Reserved' : (w.p ? inr(w.p) : 'Price on request'); }
function priceLine(w){ return `<p class="price"><span class="dot dot-${w.st}" aria-hidden="true"></span>${statusText(w)}</p>`; }
function card(w){
  const a = artist(w.a);
  return `<article class="work"><a class="frame-link" href="#/work/${w.id}" aria-label="${esc(w.t)}"><div class="frame">${art(w)}</div></a>
    <div class="label"><h3><a href="#/work/${w.id}">${esc(w.t)}</a></h3><p class="by">${esc(a.name)}</p><p class="meta">${esc(w.m)}, ${esc(w.s)}</p>${priceLine(w)}</div></article>`;
}
function showStatus(e){
  const now = new Date(), s = new Date(e.start + 'T00:00:00'), en = new Date(e.end + 'T23:59:59');
  if (now < s) return 'Opens ' + s.toLocaleDateString('en-IN', {day:'numeric', month:'long'});
  if (now <= en) return 'On now, until ' + en.toLocaleDateString('en-IN', {day:'numeric', month:'long'});
  return 'Past show';
}
function range(e){
  const s = new Date(e.start + 'T00:00:00'), en = new Date(e.end + 'T00:00:00');
  if (s.getMonth() === en.getMonth() && s.getFullYear() === en.getFullYear()) return `${s.getDate()} to ${fmtDate(e.end)}`;
  return `${fmtDate(e.start)} to ${fmtDate(e.end)}`;
}
const author = p => p.a ? artist(p.a).name : 'The collective';
function postItem(p){ return `<li><h3><a href="#/post/${p.id}">${esc(p.t)}</a></h3><p>${esc(p.body[0].slice(0, 130))}…</p><p class="m">${esc(author(p))}, ${fmtDate(p.date)}</p></li>`; }

          <h2>Enquiries about your works</h2>${enqItems(myEnq)}
        </section>
      </div></div>`;
  }
  const pending = state.added.filter(w => w.pub === 'pending');
  return `<div class="wrap">
    <div class="studio-head"><div><h1>Studio</h1><p>Signed in as admin</p></div><div class="actions" style="margin:0"><button class="btn small" data-action="reset">Reset demo data</button><button class="btn small" data-action="logout">Sign out</button></div></div>
    <div class="stats panel" style="margin-bottom:24px"><div>${publicWorks().length}<span>Works on the site</span></div><div>${pending.length}<span>Waiting for review</span></div><div>${state.enq.length}<span>Enquiries received</span></div><div>${ARTISTS.length}<span>Members</span></div></div>
    <div class="studio-grid">
      <section class="panel"><h2>Waiting for review</h2>
        ${pending.length ? `<ul class="rows">${pending.map(w => row(w, `${artist(w.a).name}, ${w.cat}, ${statusText(w)}`) + `<span class="btns"><button class="btn small primary" data-action="approve" data-id="${w.id}">Approve</button><button class="btn small" data-action="decline" data-id="${w.id}">Decline</button></span></li>`).join('')}</ul>`
          : `<p class="none">Nothing to review. Sign in as a member and add a work to see it arrive here.</p>`}
      </section>
      <section class="panel"><h2>All enquiries</h2>${enqItems(state.enq)}</section>
    </div></div>`;
}
function readImage(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({data: c.toDataURL('image/jpeg', .8), r: c.width / c.height});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const PLACEHOLDER = {
  Drawing:{style:'charcoal', v:'trees', pal:['#ECE8DF','#1A1917','#6A655E']},
  Painting:{style:'field', n:2, pal:['#3A3F58','#C77D4E','#E9C99A']},
  Print:{style:'tiles', n:4, pal:['#F2EEE4','#5A2E6E','#D0873A','#2C5B6B']},
  Sculpture:{style:'vessel', form:'tall', pal:['#D6D1C7','#B3AB9E','#3F4A52','#8FA0A8']},
  Textile:{style:'threads', pal:['#F1ECE0','#7A2F4A','#2F6A7A','#C99A2E','#7A2F4A']}
};


/* ---------- gallery stage and carousel ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){
  const wood = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520"><filter id="w" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.2 0.008" numOctaves="4" seed="7" stitchTiles="stitch"/><feColorMatrix values="0.6 0 0 0 0.17  0.38 0 0 0 0.09  0.2 0 0 0 0.04  0 0 0 0 1"/></filter><rect width="100%" height="100%" filter="url(#w)"/></svg>`;
  document.documentElement.style.setProperty('--wood', `url("data:image/svg+xml,${encodeURIComponent(wood)}")`);
})();
const KIND = {Painting:'gilt', Drawing:'black', Print:'walnut', Textile:'rod', Sculpture:'plinth'};
function stage(w, o = {}){
  const a = artist(w.a);
  let kind = KIND[w.cat] || 'gilt'; if (kind === 'plinth' && w.img) kind = 'walnut';
  const tag = o.link ? 'a' : 'div';
  const attrs = o.link ? ` href="#/work/${w.id}" draggable="false" aria-label="${esc(w.t)} by ${esc(a.name)}, view details"` : '';
  const piece = kind === 'plinth'
    ? `<div class="beam"></div><div class="fixture"></div><div class="pool"></div><${tag} class="piece-link plinth-set dim"${attrs}>${svgArt(w, {bare:true})}<div class="plinth"></div></${tag}>`
    : `<div class="hang k-${kind}" style="--r:${w.r}"><div class="glow"></div><div class="lamp"><span class="arm"></span></div><${tag} class="piece-link"${attrs}><div class="fr dim"><div class="pic">${art(w)}<span class="sheen"></span></div></div></${tag}></div>`;
  return `<div class="stage${kind === 'plinth' ? ' is-plinth' : ''}${o.full ? ' full' : ''}">${piece}<div class="floor"></div>
    <div class="plaque dim"><strong>${esc(w.t)}</strong><span>${esc(a.name)}, ${esc(w.y)}</span><span class="pm">${esc(w.m)}</span><span class="pp"><span class="dot dot-${w.st}" aria-hidden="true"></span>${statusText(w)}</span></div></div>`;
}
const FEATURED = ['w10','w14','w1','w12','w19','w7','w15','w4','w21','w13','w3','w9'];
const car = {i:0, timer:null, litT:null, paused:false, hover:false, swiped:false};
const chevron = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
function carouselHTML(){
  const ws = FEATURED.map(id => findWork(id)).filter(Boolean);
  return `<section class="carousel" aria-roledescription="carousel" aria-label="Featured works">
    <div class="stage-wrap" id="car">
      ${ws.map((w, i) => `<div class="slide" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${ws.length}: ${esc(w.t)}">${stage(w, {link:true})}</div>`).join('')}
      <button class="car-btn prev" data-action="car-prev" aria-label="Previous work">${chevron('M15 5l-7 7 7 7')}</button>
      <button class="car-btn next" data-action="car-next" aria-label="Next work">${chevron('M9 5l7 7-7 7')}</button>
    </div>
    <div class="car-bar">
      <div class="cdots">${ws.map((w, i) => `<button class="cdot" data-action="car-go" data-i="${i}" aria-label="Show ${esc(w.t)}"></button>`).join('')}</div>
      <span class="ccount" aria-live="polite"></span>
      <button class="car-pp" data-action="car-pause" aria-label="Pause slideshow"></button>
    </div>
  </section>`;
}
function carGo(i, byUser){
  const slides = [...document.querySelectorAll('#car .slide')]; if (!slides.length) return;
  const n = slides.length; i = (i + n) % n; car.i = i;
  slides.forEach((s, k) => { const on = k === i; s.classList.toggle('active', on); s.inert = !on; s.setAttribute('aria-hidden', String(!on)); if (!on) s.querySelector('.stage').classList.remove('lit'); });
  document.querySelectorAll('.cdot').forEach((d, k) => d.setAttribute('aria-current', String(k === i)));
  const w = findWork(FEATURED[i]); const c = document.querySelector('.ccount'); if (c && w) c.innerHTML = `<b>${i + 1} / ${n}</b><span class="ct">&ensp;${esc(w.t)}, ${esc(artist(w.a).name)}</span>`;
  clearTimeout(car.litT);
  car.litT = setTimeout(() => slides[i].querySelector('.stage').classList.add('lit'), reduceMotion ? 0 : 650);
  if (byUser) carStart();
}
function setPP(b){ if (!b) return; b.setAttribute('aria-label', car.paused ? 'Play slideshow' : 'Pause slideshow');
  b.innerHTML = car.paused ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>'; }
function carStop(){ clearInterval(car.timer); car.timer = null; }
function carStart(){ carStop(); if (reduceMotion || car.paused || car.hover || !document.getElementById('car')) return; car.timer = setInterval(() => carGo(car.i + 1), 7000); }
function initCarousel(){
  const root = document.getElementById('car'); if (!root) return;
  const box = root.closest('.carousel');
  if (reduceMotion) car.paused = true;
  setPP(box.querySelector('[data-action="car-pause"]'));
  carGo(car.i); carStart();
  box.addEventListener('mouseenter', () => { car.hover = true; carStop(); });
  box.addEventListener('mouseleave', () => { car.hover = false; carStart(); });
  box.addEventListener('focusin', () => carStop());
  box.addEventListener('focusout', e => { if (!box.contains(e.relatedTarget)) carStart(); });
  box.addEventListener('keydown', e => { if (e.key === 'ArrowRight') carGo(car.i + 1, true); else if (e.key === 'ArrowLeft') carGo(car.i - 1, true); });
  let sx = null;
  root.addEventListener('pointerdown', e => { sx = e.clientX; car.swiped = false; });
  root.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50){ car.swiped = true; carGo(car.i + (dx < 0 ? 1 : -1), true); } });
  root.addEventListener('click', e => { if (car.swiped){ e.preventDefault(); e.stopPropagation(); car.swiped = false; } }, true);
}

/* ---------- router ---------- */
const main = $('#main');
function render(keepScroll){
  const [route, id] = location.hash.replace(/^#\/?/, '').split('/');
  let html, nav = '', title = 'Petrichor Collective';
  switch (route){
    case 'works': html = worksPage(); nav = 'works'; title = 'Works | ' + title; break;
    case 'work': { html = workPage(id); nav = 'works'; const w = findWork(id); if (w) title = w.t + ' | ' + title; break; }
    case 'artists': html = artistsPage(); nav = 'artists'; title = 'Artists | ' + title; break;
    case 'artist': { html = artistPage(id); nav = 'artists'; const a = artist(id); if (a) title = a.name + ' | ' + title; break; }
    case 'exhibitions': html = showsPage(); nav = 'exhibitions'; title = 'Exhibitions | ' + title; break;
    case 'journal': html = journalPage(); nav = 'journal'; title = 'Journal | ' + title; break;
    case 'post': html = postPage(id); nav = 'journal'; break;
    case 'studio': html = studioPage(); nav = 'studio'; title = 'Studio | ' + title; break;
    default: html = home();
  }
  main.innerHTML = html;
  document.title = title;
  document.querySelectorAll('nav.main a').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const studioLink = $('nav.main a.studio-link'); studioLink.textContent = state.session ? 'Studio' : 'Studio sign in';
  if (route === 'works') fillGallery();
  carStop(); if (!route) initCarousel();
  if (route === 'artist'){ const st = main.querySelector('.ah-stage .stage'); if (st) setTimeout(() => st.classList.add('lit'), reduceMotion ? 0 : 2700); }
  if (!keepScroll){ window.scrollTo(0, 0); main.focus({preventScroll:true}); }
}
window.addEventListener('hashchange', () => render());

/* ---------- events ---------- */
function openLightbox(w){
  const lb = $('#lightbox'); lb.querySelector('.lb-art').innerHTML = stage(w, {full:true});
  lb.classList.add('open'); document.body.style.overflow = 'hidden'; lb.querySelector('.lb-close').focus();
  setTimeout(() => { const st = lb.querySelector('.stage'); if (st) st.classList.add('lit'); }, reduceMotion ? 0 : 450);
}
function closeLightbox(){ const lb = $('#lightbox'); if (!lb.classList.contains('open')) return; lb.classList.remove('open'); lb.querySelector('.lb-art').innerHTML = ''; document.body.style.overflow = ''; const z = main.querySelector('.zoom'); if (z) z.focus(); }
function saveSession(){ store.set('session', state.session); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  if (act === 'cat'){ state.filter.cat = el.dataset.cat; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.cat === state.filter.cat)); fillGallery(); }
  else if (act === 'clear'){ state.filter = {cat:'All', avail:false}; render(true); }
  else if (act === 'zoom'){ openLightbox(findWork(el.dataset.id)); }
  else if (act === 'close-lb'){ closeLightbox(); }
  else if (act === 'car-next'){ carGo(car.i + 1, true); }
  else if (act === 'car-prev'){ carGo(car.i - 1, true); }
  else if (act === 'car-go'){ carGo(+el.dataset.i, true); }
  else if (act === 'car-pause'){ car.paused = !car.paused; setPP(el); car.paused ? carStop() : carStart(); }
  else if (act === 'enquire'){ const id = location.hash.split('/')[2]; $('#enq-panel').innerHTML = enquiryForm(findWork(id)); $('#en-name').focus(); }
  else if (act === 'login-member'){ state.session = {role:'member', artistId:'a3'}; saveSession(); render(); toast('Signed in as Tanvi Rao'); }
  else if (act === 'login-admin'){ state.session = {role:'admin'}; saveSession(); render(); toast('Signed in as admin'); }
  else if (act === 'logout'){ state.session = null; store.del('session'); render(); toast('Signed out'); }
  else if (act === 'approve' || act === 'decline'){
    const w = state.added.find(x => x.id === el.dataset.id); if (!w) return;
    w.pub = act === 'approve' ? 'published' : 'declined'; store.set('added', state.added); render(true);
    toast(act === 'approve' ? `Approved. “${w.t}” is now on the site.` : `Declined. “${w.t}” stays off the site.`);
  }
  else if (act === 'reset'){ ['added','enq'].forEach(store.del); state.added = []; state.enq = []; render(true); toast('Demo data reset'); }
});
document.addEventListener('change', e => { if (e.target.id === 'avail'){ state.filter.avail = e.target.checked; fillGallery(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.id === 'enq-form'){
    e.preventDefault();
    const w = findWork(form.dataset.id), fd = new FormData(form);
    state.enq.unshift({id:'q' + Date.now().toString(36), workId:w.id, name:fd.get('name').trim(), contact:fd.get('contact').trim(), message:fd.get('message').trim(), at:new Date().toISOString()});
    store.set('enq', state.enq);
    $('#enq-panel').innerHTML = contactBlock(artist(w.a), w); $('#sent').focus();
  }
  if (form.id === 'add-form'){
    e.preventDefault();
    const fd = new FormData(form), file = fd.get('photo'), btn = form.querySelector('[type=submit]');
    btn.disabled = true; btn.textContent = 'Sending…';
    let img = null, r = 1;
    if (file && file.size){
      try { const o = await readImage(file); img = o.data; r = o.r; }
      catch(err){ btn.disabled = false; btn.textContent = 'Send for review'; toast('That file could not be read. Choose a JPG, PNG or WebP photo.'); return; }
    }
    const cat = fd.get('cat');
    const w = {id:'u' + Date.now().toString(36), t:fd.get('title').trim(), a:state.session.artistId, cat, m:(fd.get('materials') || '').trim() || cat,
      s:(fd.get('size') || '').trim() || 'Size on request', y:+fd.get('year') || 2026, p:+fd.get('price') || 0, st:'available',
      r: img ? r : (cat === 'Textile' ? .75 : cat === 'Painting' ? .8 : 1), g: img ? null : PLACEHOLDER[cat], img, d:(fd.get('desc') || '').trim(), pub:'pending'};
    state.added.push(w);
    if (!store.set('added', state.added)){
      state.added.pop(); btn.disabled = false; btn.textContent = 'Send for review';
      toast('The photo is too large to keep in this demo. Try a smaller image.'); return;
    }
    render(true); toast(`Sent for review. An admin will publish “${w.t}”.`);
  }
});

render();
</script>
